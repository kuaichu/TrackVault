services:
  trackvault:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trackvault-v2
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      # Default to loopback binding; switch to "3010:3010" if exposing directly on LAN (or keep loopback behind a reverse proxy)
      - "127.0.0.1:3010:3010"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
      DATA_DIR: /data
      # Set your actual origin(s) when deploying behind reverse proxy / LAN IP
      ALLOWED_ORIGINS: "http://localhost:3010,http://127.0.0.1:3010"
      # Strongly recommended: inject a fixed 64-char hex master key via env/secret file so it is NOT co-located with the encrypted DB in /data/.master.key
      TRACKVAULT_MASTER_KEY: ${TRACKVAULT_MASTER_KEY:-}
      # Set to "true" behind HTTPS reverse proxy
      COOKIE_SECURE: "auto"
    volumes:
      - trackvault_data:/data

volumes:
  trackvault_data:
